<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>仏滅の夜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
/* 仏滅の夜 — 墨色の夜・霧・提灯の灯・血の赤。夜だけの世界なので、明るいテーマは作らない */
:root {
  --night: #080b11;
  --ink: #0f141d;
  --fog: #1b2330;
  --mist: #2c3646;
  --paper: #ece4d1;
  --dim: #98a0ad;
  --blood: #c4303a;
  --blood-deep: #6e1218;
  --lantern: #e3a64a;
  --moss: #7cb88a;
  --sky: #6a98dc;
  --panel: rgba(10, 14, 21, 0.72);
  --line: rgba(236, 228, 209, 0.14);
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--night); color: var(--paper); font-family: var(--font-ui); font-size: 14px; -webkit-font-smoothing: antialiased; user-select: none; }
button { font: inherit; color: inherit; }
kbd { display: inline-block; min-width: 1.7em; padding: 1px 6px; margin-right: 6px; border: 1px solid rgba(236, 228, 209, 0.45); border-bottom-width: 2px; border-radius: 4px; font-family: var(--font-ui); font-size: 12px; font-weight: 700; text-align: center; color: var(--paper); background: rgba(0, 0, 0, 0.35); }
#app { position: fixed; inset: 0; }
#cv { display: block; width: 100%; height: 100%; }
#vign { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.4s; background: radial-gradient(ellipse at center, transparent 42%, rgba(30, 0, 4, 0.55) 72%, rgba(5, 0, 0, 0.95) 100%); }
#vign.rage { background: radial-gradient(ellipse at center, transparent 45%, rgba(120, 10, 14, 0.5) 85%, rgba(60, 0, 0, 0.9) 100%); }
#hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.18s; background: radial-gradient(ellipse at center, rgba(196, 48, 58, 0.15), rgba(140, 10, 20, 0.75)); }
#fade { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 0; }
#loading { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; background: var(--night); gap: 10px; }
.ld-t { font-family: var(--font-display); font-weight: 800; font-size: 54px; letter-spacing: 0.3em; }
.ld-s { color: var(--dim); }
#boot-fail { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(8, 11, 17, 0.9); padding: 16px; }
#boot-fail .card p { color: var(--dim); }

/* ---------- ボタン ---------- */
.btn { padding: 10px 18px; border-radius: 6px; border: 1px solid var(--line); background: rgba(28, 35, 48, 0.85); color: var(--paper); font-weight: 700; cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s; }
.btn:hover { background: rgba(44, 54, 70, 0.95); border-color: rgba(236, 228, 209, 0.35); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .role:focus-visible, .char:focus-visible, .seg button:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
.btn.primary { background: var(--blood); border-color: #e0505a; }
.btn.primary:hover { background: #d53c46; }
.btn.danger { border-color: rgba(196, 48, 58, 0.6); color: #f2b0b4; }
.btn.big { padding: 14px 34px; font-size: 17px; letter-spacing: 0.1em; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { padding: 8px 16px; border: 0; background: transparent; cursor: pointer; font-weight: 700; color: var(--dim); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: rgba(196, 48, 58, 0.85); color: var(--paper); }

/* ---------- タイトル ---------- */
#title { position: absolute; inset: 0; overflow-y: auto; background: linear-gradient(100deg, rgba(8, 11, 17, 0.95) 0%, rgba(8, 11, 17, 0.78) 48%, rgba(8, 11, 17, 0.45) 100%); }
.t-in { min-height: 100%; display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: clamp(20px, 4vw, 64px); align-items: center; padding-block: max(28px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px), 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw); }
.t-head { display: grid; gap: 16px; align-content: center; }
.t-eyebrow { margin: 0; color: var(--lantern); font-weight: 700; letter-spacing: 0.35em; font-size: 13px; }
.t-name { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(54px, 7.6vw, 120px); line-height: 1; letter-spacing: 0.12em; text-shadow: 0 0 40px rgba(196, 48, 58, 0.25); }
.t-name::after { content: ""; display: block; width: 62%; height: 6px; margin-top: 14px; background: linear-gradient(90deg, var(--blood), rgba(196, 48, 58, 0)); border-radius: 3px; }
.t-lead { margin: 0; max-width: 34em; color: #d4ccba; line-height: 1.9; font-size: 15px; }
.t-btns { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.t-note { margin: 0; color: var(--dim); font-size: 12px; }
.t-side { display: grid; gap: 18px; background: rgba(10, 14, 21, 0.6); border: 1px solid var(--line); border-radius: 10px; padding: clamp(14px, 2vw, 22px); }
.t-lbl { margin: 0 0 8px; color: var(--dim); font-size: 12px; letter-spacing: 0.15em; font-weight: 700; }
.t-roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.role { text-align: left; display: grid; gap: 2px; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); background: rgba(27, 35, 48, 0.6); cursor: pointer; }
.role b { font-family: var(--font-display); font-size: 20px; }
.role span { color: var(--dim); font-size: 12px; }
.role.on { border-color: var(--blood); background: rgba(110, 18, 24, 0.45); box-shadow: inset 4px 0 0 var(--blood); }
.chars { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.char { position: relative; text-align: left; padding: 10px 10px 8px; border-radius: 8px; border: 1px solid var(--line); background: rgba(27, 35, 48, 0.55); cursor: pointer; display: grid; gap: 1px; min-width: 0; }
.char.on { border-color: var(--lantern); background: rgba(80, 56, 20, 0.4); }
.char b { font-size: 15px; }
.char em { font-style: normal; color: var(--dim); font-size: 11px; }
.char .swatch { position: absolute; top: 10px; right: 10px; width: 10px; height: 10px; border-radius: 50%; }
.stats { display: grid; gap: 2px; margin-top: 6px; }
.st { display: grid; grid-template-columns: 2.6em 1fr; align-items: center; gap: 4px; font-size: 10px; color: var(--dim); }
.st i { height: 4px; background: rgba(236, 228, 209, 0.1); border-radius: 2px; overflow: hidden; }
.st u { display: block; height: 100%; background: var(--paper); text-decoration: none; }
.t-desc { margin: 10px 0 0; color: #d4ccba; font-size: 13px; }
.k-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.k-list li { color: #d4ccba; line-height: 1.6; }
.k-list b { color: var(--blood); font-family: var(--font-display); margin-right: 6px; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.h-top { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: 14px; right: 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: start; gap: 12px; }
.h-obj { justify-self: start; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.h-lbl { margin: 0 0 2px; color: var(--dim); font-size: 11px; letter-spacing: 0.12em; }
.or { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; }
.or b { width: 4.8em; color: var(--paper); white-space: nowrap; }
.or.done b { color: var(--moss); }
.ck { padding: 1px 6px; border-radius: 3px; background: rgba(236, 228, 209, 0.08); color: var(--dim); }
.ck.ok { background: rgba(124, 184, 138, 0.22); color: #bfe8c8; }
.ck.eta { background: rgba(227, 166, 74, 0.2); color: #f2d39c; font-variant-numeric: tabular-nums; }
.h-clock { text-align: center; display: grid; justify-items: center; }
.h-clock-l { color: var(--dim); font-size: 11px; letter-spacing: 0.2em; }
.h-clock b { font-family: var(--font-display); font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px #000; }
.h-rage { margin-top: 2px; padding: 0 8px; border-radius: 3px; background: var(--blood); font-size: 12px; font-weight: 900; letter-spacing: 0.2em; }
.h-roster { justify-self: end; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 360px; }
.rs { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 5px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; }
.rs i { width: 8px; height: 8px; border-radius: 50%; }
.rs.dead { color: #c98a8e; text-decoration: line-through; opacity: 0.7; }
.rs.out { color: var(--moss); }
.rs.me { border-color: var(--lantern); }
#feed { position: absolute; left: 14px; top: 228px; display: grid; gap: 4px; max-width: min(420px, 60vw); }
.msg { padding: 5px 10px; border-radius: 4px; background: var(--panel); border-left: 3px solid var(--mist); font-size: 13px; animation: msgIn 0.25s ease-out, msgOut 0.6s ease-in 6s forwards; }
.msg.good { border-left-color: var(--moss); }
.msg.bad { border-left-color: var(--blood); color: #ffd5d7; }
.msg.warn { border-left-color: var(--lantern); }
.msg.info { border-left-color: var(--sky); }
.msg.dim { color: var(--dim); }
@keyframes msgIn { from { opacity: 0; transform: translateX(-8px); } }
@keyframes msgOut { to { opacity: 0; } }
#cross { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(236, 228, 209, 0.75); box-shadow: 0 0 4px #000; }
#prompt { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 90vw; }
#prompt span { padding: 6px 12px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); font-weight: 700; white-space: nowrap; }
#prompt span.off { color: var(--dim); font-weight: 400; }
#prog { position: absolute; left: 50%; top: 69%; transform: translateX(-50%); display: grid; gap: 4px; justify-items: center; min-width: 220px; }
#prog span, #mash span { font-size: 13px; text-shadow: 0 1px 4px #000; }
#prog i, #mash i { display: block; width: 220px; height: 6px; border-radius: 3px; background: rgba(236, 228, 209, 0.15); overflow: hidden; }
#prog b { display: block; height: 100%; background: var(--lantern); }
#skill { position: absolute; left: 50%; top: 50%; margin: -90px; }
#mash { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); display: grid; justify-items: center; gap: 6px; }
#mash span { font-size: 18px; font-weight: 900; color: #ffd5d7; animation: pulse 0.35s infinite alternate; }
#mash b { display: block; height: 100%; background: var(--blood); }
@keyframes pulse { to { transform: scale(1.08); } }
.h-me { position: absolute; left: 14px; bottom: max(14px, env(safe-area-inset-bottom, 0px)); width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
.me-n { display: flex; align-items: baseline; gap: 8px; }
.me-n b { font-family: var(--font-display); font-size: 20px; }
.me-n span { color: var(--dim); font-size: 12px; }
.me-n .tagx { color: var(--lantern); }
.bar { display: grid; grid-template-columns: 4.6em 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.bar i { height: 7px; border-radius: 4px; background: rgba(236, 228, 209, 0.1); overflow: hidden; }
.bar b { display: block; height: 100%; transition: width 0.15s; }
.bar.hp b { background: var(--moss); }
.bar.low b { background: var(--blood); }
.bar.st b { background: var(--sky); }
.bar.fear b { background: linear-gradient(90deg, #8a5a9a, var(--blood)); }
.me-s { font-size: 11px; color: var(--dim); }
.h-inv { position: absolute; right: 14px; bottom: max(14px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; align-items: stretch; }
.slot { width: 92px; min-height: 64px; padding: 6px 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); display: grid; align-content: start; gap: 2px; }
.slot kbd { justify-self: start; font-size: 10px; padding: 0 5px; }
.slot b { font-size: 13px; line-height: 1.25; }
.slot small { font-size: 10px; color: var(--dim); line-height: 1.3; }
.slot.empty b { color: var(--dim); font-weight: 400; }
.slot.part { border-color: rgba(227, 166, 74, 0.6); }
.h-k { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; }
.abs { display: flex; gap: 8px; }
.ab { position: relative; width: 92px; padding: 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); display: grid; gap: 2px; overflow: hidden; }
.ab > i { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.55); }
.ab kbd, .ab b, .ab small { position: relative; }
.ab b { font-family: var(--font-display); font-size: 16px; }
.ab small { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.ab.act { border-color: var(--blood); box-shadow: 0 0 14px rgba(196, 48, 58, 0.5); }
.ab:not(.cd):not(.act) small { color: var(--moss); }
.kc { display: flex; gap: 14px; padding: 5px 12px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; }
.kc b { color: var(--lantern); }
#pings { position: absolute; inset: 0; overflow: hidden; }
.ping { position: absolute; width: 30px; height: 30px; margin: -15px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.85); box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); animation: ping 0.9s ease-out infinite; }
@keyframes ping { from { transform: scale(0.4); } to { transform: scale(1.2); } }
#spect { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); padding: 8px 16px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
#lockhint { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); display: grid; gap: 4px; text-align: center; padding: 16px 22px; border-radius: 10px; background: rgba(8, 11, 17, 0.85); border: 1px solid var(--line); }
#lockhint b { font-size: 16px; }
#lockhint span { color: var(--dim); font-size: 12px; }

/* ---------- 地図 ---------- */
#mapv { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4, 6, 10, 0.78); padding: 16px; }
.map-in { display: grid; gap: 8px; justify-items: center; }
#mapcv { width: min(84vh, 92vw); height: min(84vh, 92vw); border-radius: 8px; border: 1px solid var(--line); }
#mapv.morph #mapcv { cursor: crosshair; border-color: var(--blood); box-shadow: 0 0 30px rgba(196, 48, 58, 0.35); }
#map-hint { margin: 0; color: var(--dim); }

/* ---------- まど(メニュー・結果) ---------- */
#modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4, 6, 10, 0.72); overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { width: min(560px, 100%); background: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: clamp(16px, 3vw, 28px); display: grid; gap: 14px; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 26px; }
.card h3 { margin: 6px 0 2px; font-size: 14px; color: var(--lantern); letter-spacing: 0.1em; }
.card ul { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; line-height: 1.7; color: #d4ccba; }
.card p { margin: 0; line-height: 1.7; color: #d4ccba; }
.card.help { width: min(980px, 100%); }
.help-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 22px; }
.tip { font-size: 13px; padding: 10px 12px; border-radius: 6px; background: rgba(227, 166, 74, 0.1); border-left: 3px solid var(--lantern); }
.keys { border-collapse: collapse; width: 100%; font-size: 13px; }
.keys td { padding: 4px 0; vertical-align: top; color: #d4ccba; }
.keys td:first-child { width: 8.5em; }
.m-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.m-col { display: grid; gap: 8px; }
.set { display: grid; grid-template-columns: 8em 1fr; align-items: center; gap: 12px; }
.set input { width: 100%; accent-color: var(--blood); }
.end { text-align: center; }
.end .m-btns { justify-content: center; }
.end-h { font-size: clamp(30px, 6vw, 46px) !important; }
.end.win .end-h { color: var(--paper); }
.end.lose .end-h { color: #f0a0a6; }
.end-sub { color: var(--dim) !important; }
.res { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
.res td { padding: 7px 10px; border-top: 1px solid var(--line); }
.res small { margin-left: 8px; color: var(--dim); font-size: 11px; }
.res .good { color: #bfe8c8; text-align: right; }
.res .bad { color: #f0a0a6; text-align: right; }
.res tr.me td { background: rgba(227, 166, 74, 0.08); }
.end-stat { font-size: 13px; color: var(--dim) !important; font-variant-numeric: tabular-nums; }

@media (max-width: 860px) {
  .t-in { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .h-roster { display: none; }
  .h-obj { font-size: 11px; }
  .h-inv .slot { width: 70px; }
}
@media (max-width: 520px) {
  .t-roles { grid-template-columns: 1fr; }
  .h-inv, .h-k { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .msg, #mash span, .ping { animation: none; }
}

/* ---------- 追加: クイックプレイ・パーク ---------- */
.btn.qp { border-color: rgba(227, 166, 74, 0.7); color: #f2d39c; }
.btn.sm { padding: 5px 10px; font-size: 12px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.char .pk { display: block; margin-top: 4px; font-size: 10px; color: var(--lantern); line-height: 1.3; }
.dim { color: var(--dim) !important; }
.warn { color: #f2d39c !important; }
.note { font-size: 12px; padding: 8px 10px; border-radius: 6px; background: rgba(106, 152, 220, 0.12); border-left: 3px solid var(--sky); }
.mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
.card.perks { width: min(1040px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; }
.p-top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.p-top h2 { margin-right: auto; }
.cpv { font-family: var(--font-display); font-size: 22px; color: var(--lantern); font-variant-numeric: tabular-nums; }
.ptabs { align-self: start; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { padding: 5px 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(27, 35, 48, 0.6); cursor: pointer; font-weight: 700; color: var(--dim); }
.chip.on { border-color: var(--lantern); color: var(--paper); }
.slots3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 12px; }
.slotp { display: grid; gap: 4px; align-content: start; }
.pempty { min-height: 74px; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 8px; color: var(--dim); }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.pcard { display: grid; gap: 3px; align-content: start; padding: 9px 11px; border-radius: 8px; background: rgba(27, 35, 48, 0.75); border: 1px solid var(--line); border-left-width: 4px; text-align: left; }
.pcard p { margin: 0; font-size: 12.5px; line-height: 1.45; }
.pc-h { display: flex; align-items: center; gap: 8px; }
.pc-h b { font-size: 15px; margin-right: auto; }
.rar { font-size: 11px; font-weight: 900; color: #10141c; padding: 1px 7px; border-radius: 10px; }
.pos { color: #bfe8c8; }
.neg { color: #f0a0a6; }
.pbtn { padding: 0; border: 0; background: none; cursor: pointer; text-align: left; }
.pbtn:hover .pcard { background: rgba(44, 54, 70, 0.9); }
.rolled { padding: 10px; border-radius: 10px; background: rgba(227, 166, 74, 0.12); border: 1px solid rgba(227, 166, 74, 0.5); display: grid; gap: 6px; animation: msgIn 0.4s ease-out; }
.qstat { display: flex; align-items: center; gap: 10px; font-weight: 700; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 3px solid rgba(236, 228, 209, 0.2); border-top-color: var(--lantern); animation: spin 0.9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

  fireLight.intensity = 12 + Math.sin(t * 13) * 2 + Math.sin(t * 7.3) * 1.5;
  for (const f of W.flames) f.scale.setScalar(2 + Math.sin(t * 11) * 0.15);
  lampT -= dt;
  if (lampT <= 0) {
    lampT = 0.3;
    const near = nearestLamps(camera3.position.x, camera3.position.z, 3);
    lampLights.forEach((l, i) => {
      const L3 = near[i];
      if (L3) {
        l.position.set(L3.x, 2.4, L3.z);
        l.intensity = 7;
      } else l.intensity = 0;
    });
  }
  hemi.intensity = G.role === "killer" && G.mode !== "title" ? 3.2 : 2.2;
  const fo = flashOwner();
  if (fo) {
    flash.intensity = 36;
    camera3.getWorldDirection(v33);
    flash.position.set(fo.x + Math.sin(fo.rot) * 0.2, fo.state === "vehicle" ? 1.4 : 1.35, fo.z + Math.cos(fo.rot) * 0.2);
    flash.target.position.set(fo.x + v33.x * 12, 1.35 + v33.y * 12, fo.z + v33.z * 12);
  } else flash.intensity = 0;
  for (const it of G.items) it.glow.material.opacity = 0.35 + Math.sin(t * 3 + it.id) * 0.15;
  if (G.net === "client") for (let i = G.fx.length - 1; i >= 0; i--) {

    if (f.mesh) f.mesh.material.opacity = Math.max(0, f.t / f.life);

      scene.remove(f.mesh);
      G.fx.splice(i, 1);
    }

  let mi = 0;
  const senseOn = k && k === G.me && k.senseT > 0;
  if (senseOn) for (const s of G.students) {

    if (!G.senseIds.has(s.id)) continue;

    m.position.set(s.x, 1.2, s.z);
    const sz = 1.2 + s.fear / 100 * 1.6;

    m.material.opacity = 0.45 + s.fear / 100 * 0.5;
  }

    hitbox.position.set(hm.x, 0, hm.z);
    hitbox.rotation.y = CAM.yaw;
    hitboxFan.scale.set(r, r, 1);
    hitboxFan.material.opacity = hm.atk ? 0.5 : 0.2;
    hitboxFan.material.color.setHex(hm.stance ? 16740432 : 16765024);
  }
  if (G.mode === "play") audioFrame(dt);
  else updateMusic(dt, { tension: 0.15, fear: 0, mode: "student", outside: true });

  drawMap2();
  if (!G.noRender) renderer.render(scene, camera3);
}
function audioFrame(dt) {

      CAM.shake = 0.5;
    }
    if (close) scareSeen = G.t;

}
